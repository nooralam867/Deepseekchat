<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI-Assisted Chatbox</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="chat-container">
    <div class="chat-window" id="user1-window">
      <h2>User 1</h2>
      <div class="chat-history" id="user1-history"></div>
      <div class="input-area">
        <textarea id="user1-input" placeholder="Type your message..."></textarea>
        <button onclick="sendMessage('user1')">Send</button>
        <label>
          <input type="checkbox" id="user1-ai-toggle"> Use AI
        </label>
      </div>
    </div>

    <div class="chat-window" id="user2-window">
      <h2>User 2</h2>
      <div class="chat-history" id="user2-history"></div>
      <div class="input-area">
        <textarea id="user2-input" placeholder="Type your message..."></textarea>
        <button onclick="sendMessage('user2')">Send</button>
        <label>
          <input type="checkbox" id="user2-ai-toggle"> Use AI
        </label>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
