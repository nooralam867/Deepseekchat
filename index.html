<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot with DeepSeek API</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>AI Chatbot with DeepSeek API</h1>

        <!-- Text Input Section -->
        <div class="chat-section">
            <h2>Chat with AI</h2>
            <div id="chatBox">
                <!-- Chat messages will appear here -->
            </div>
            <input type="text" id="chatInput" placeholder="Type your question here...">
            <button onclick="sendMessage()">Send</button>
        </div>

        <!-- Image Upload Section -->
        <div class="upload-section">
            <h2>Upload MCQ Images</h2>
            <input type="file" id="fileInput" multiple accept="image/jpeg">
            <button onclick="processImages()">Submit Images</button>
            <div id="imageResults"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
