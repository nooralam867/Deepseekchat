<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot with DeepSeek API</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>AI Chatbot for MCQ Questions</h1>
        <form id="chatForm">
            <label for="textInput">Enter your text:</label>
            <textarea id="textInput" name="textInput" rows="4" cols="50"></textarea>
            <br>
            <label for="imageInput">Upload MCQ Images:</label>
            <input type="file" id="imageInput" name="imageInput" multiple accept="image/jpeg">
            <br>
            <button type="submit">Submit</button>
        </form>
        <div id="response"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
